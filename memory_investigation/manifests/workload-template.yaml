apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-client
  labels:
    app: workload-client
spec:
  replicas: ${WORKLOAD_CLIENT_REPLICAS}
  selector:
    matchLabels:
      app: workload-client
  template:
    metadata:
      labels:
        app: workload-client
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: generator-pool
      containers:
      - name: client
        image: ${DOCKER_REGISTRY}/memory-investigation-workload:latest
        imagePullPolicy: Always
        command: ["./workload"]
        args: ["-mode", "client", "-protocol", "${WORKLOAD_PROTOCOL}", "-target", "${WORKLOAD_TARGET_URL}", "-qps", "${WORKLOAD_QPS}"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-server
  labels:
    app: workload-server
spec:
  replicas: ${WORKLOAD_SERVER_REPLICAS}
  selector:
    matchLabels:
      app: workload-server
  template:
    metadata:
      labels:
        app: workload-server
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: target-pool
      containers:
      - name: server
        image: ${DOCKER_REGISTRY}/memory-investigation-workload:latest
        imagePullPolicy: Always
        command: ["./workload"]
        args: ["-mode", "server", "-protocol", "${WORKLOAD_PROTOCOL}"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ${WORKLOAD_PROTOCOL}-server
spec:
  selector:
    app: workload-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
