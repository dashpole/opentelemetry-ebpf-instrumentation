apiVersion: v1
kind: Service
metadata:
  name: http-server
spec:
  selector:
    app: http-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-server
  template:
    metadata:
      labels:
        app: http-server
    spec:
      containers:
      - name: server
        image: memory-investigation-workload:latest
        imagePullPolicy: Never
        command: ["./workload"]
        args: ["-mode", "server"]
        ports:
        - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-client
  template:
    metadata:
      labels:
        app: http-client
    spec:
      containers:
      - name: client
        image: memory-investigation-workload:latest
        imagePullPolicy: Never
        command: ["./workload"]
        args: ["-mode", "client", "-target", "http://http-server.default.svc.cluster.local:8080", "-qps", "10"]
