apiVersion: v1
kind: ServiceAccount
metadata:
  name: obi
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obi
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["watch", "list"]
  - apiGroups: [""]
    resources: ["pods", "nodes", "services"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obi
subjects:
  - kind: ServiceAccount
    name: obi
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obi-config-template
data:
  obi-config.yml: |
    # dummy config map
---
apiVersion: v1
kind: Service
metadata:
  name: obi-service
  namespace: default
spec:
  selector:
    app: obi
  ports:
    - name: prom-metrics
      protocol: TCP
      port: 8081
      targetPort: 8081
    - name: pprof
      protocol: TCP
      port: 8082
      targetPort: 8082
    - name: bpf-metrics
      protocol: TCP
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: obi
  namespace: default
  labels:
    app: obi
spec:
  selector:
    matchLabels:
      app: obi
  template:
    metadata:
      labels:
        app: obi
    spec:
      serviceAccountName: obi
      hostPID: true
      containers:
        - name: obi
          image: otel/ebpf-instrument:latest
          imagePullPolicy: Never
          securityContext:
            privileged: true
          ports:
            - containerPort: 8081
              name: prom-metrics
            - containerPort: 8082
              name: pprof
          args:
            - "--config=/config/obi-config.yml"
          volumeMounts:
            - mountPath: /config
              name: obi-config
            - mountPath: /sys/kernel/debug
              name: sys-kernel-debug
          env:
            - name: OTEL_TCP_METRICS_ENABLED
              value: "false"
            - name: OTEL_EBPF_INTERNAL_METRICS_EXPORTER
              value: "prometheus"
            - name: OTEL_EBPF_INTERNAL_METRICS_PROMETHEUS_PORT
              value: "8081"
            - name: OTEL_EBPF_PROFILE_PORT
              value: "8082"
            - name: OTEL_EBPF_AUTO_TARGET_EXE
              value: "*"
            - name: OTEL_EBPF_METADATA_RETRY_TIMEOUT
              value: "0"
            - name: OTEL_EBPF_BPF_BUFFER_SIZE_KAFKA
              value: "4096"
            - name: OTEL_EBPF_BPF_BUFFER_SIZE_POSTGRES
              value: "4096"
            - name: OTEL_EBPF_BPF_BUFFER_SIZE_MYSQL
              value: "4096"
            - name: OTEL_EBPF_BPF_BUFFER_SIZE_HTTP
              value: "4096"
${OBI_ENV_VARS}
      volumes:
        - name: obi-config
          configMap:
            name: obi-config-template
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
